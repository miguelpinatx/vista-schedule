<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vista Work Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fbf9ef;--surface:#fff;--surface2:#f4f1e1;--ink:#1f2a1c;--muted:#5d6858;--line:#e7e2cc;--brand:#2E7D32;--brand-ink:#fff;
  --am-bg:#fff1c2;--am-fg:#6b4d00;--mid-bg:#d6ecfa;--mid-fg:#08507f;--pm-bg:#eadcf3;--pm-fg:#5a2b73;--off-fg:#9a93a8;--me:#fff7d6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;margin:0}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 12px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--brand);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
select,input{font:16px var(--f-body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.weeks{display:flex;gap:6px;flex-wrap:wrap}
.weeks button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:600 14px var(--f-body);cursor:pointer;color:var(--ink)}
.weeks button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.weeks small{display:block;font-weight:500;font-size:12px;opacity:.8}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px var(--f-body);cursor:pointer;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-family:var(--f-display);font-size:22px;margin:0 0 8px}
.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;font-size:14px;white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
th small{display:block;font-weight:500;text-transform:none;letter-spacing:0}
td.n,th.n{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;white-space:normal;min-width:130px}
tr.me td{background:var(--me)}
.sh{display:inline-block;border-radius:7px;padding:3px 7px;font-weight:600;font-size:13px}
.am{background:var(--am-bg);color:var(--am-fg)}.mid{background:var(--mid-bg);color:var(--mid-fg)}.pm{background:var(--pm-bg);color:var(--pm-fg)}
.off{color:var(--off-fg);font-size:12px;font-weight:600}
.today{outline:2px solid var(--brand);outline-offset:-2px}
.mine{background:var(--surface);border:2px solid var(--brand);border-radius:14px;padding:14px;margin-bottom:14px}
.mine h2{margin-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;min-height:64px}
.day b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase}
.day .sh{display:block;margin-top:4px;padding:4px 2px;font-size:12px;white-space:normal}
.day.t{border-color:var(--brand);border-width:2px}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dl{border:1px solid var(--line);border-radius:12px;padding:10px}
.dl h3{margin:0 0 6px;font-size:15px}
.dl div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px dashed var(--line);font-size:14px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink)}
@media (max-width:620px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:24px}}
@media print{.bar,.lang,.tabs,.mine{display:none}body{background:#fff}.card{border:0;padding:0}table{min-width:0}.sh{background:none!important;color:#000!important;padding:0}}
header{background:#fff;border-radius:16px;padding:10px 14px;border-bottom:5px solid #FEC938}
.vlogo{height:52px;width:auto;display:block}
h1{color:var(--brand)}
.weeks button[aria-pressed=true]{box-shadow:0 3px 0 #FEC938}
.tabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand)}
@media (max-width:620px){.vlogo{height:40px}}
</style>
</head>

  }else{
    h+=`<div class="dlist">${dayDates.map((d,i)=>{const on=rows.filter(r=>Array.isArray(r.days[i])).sort((a,b)=>toMin(a.days[i][0])-toMin(b.days[i][0]));
      return `<div class="dl ${i===tIdx?"today":""}"><h3>${t("daysL")[i]} · ${md(d)}</h3>${on.length?on.map(r=>`<div style="${r.name===me?"background:var(--me)":""}"><span>${esc(r.name)} <span class="meta">${esc(r.dept)}</span></span>${cell(r.days[i])}</div>`).join(""):`<p class="meta">${t("noneDay")}</p>`}</div>`}).join("")}</div>`;
  }
  h+=`</div>`;app.innerHTML=h;
  const qi=$("#q");if(qi){qi.oninput=e=>{q=e.target.value;const exact=names.find(n=>norm(n)===norm(q));if(exact){me=exact;ls.set("vsb-me-"+store,me)}const pos=e.target.selectionStart;render();const n=$("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
}
document.addEventListener("click",e=>{const l=e.target.closest("[data-lang]");if(l){lang=l.dataset.lang;ls.set("vsb-lang",lang);render();return}
  const w=e.target.closest("[data-week]");if(w){cur=w.dataset.week;render();return}
  const v=e.target.closest("[data-view]");if(v){view=v.dataset.view;render();return}
  if(e.target.closest("[data-notme]")){me=null;q="";ls.set("vsb-me-"+store,"");render();setTimeout(()=>{const n=$("#q");if(n)n.focus()},0)}});
async function load(){
  if(!store){render();return}
  try{const sb=window.supabase.createClient(SUPABASE_URL,KEY);
    const {data,error}=await sb.from("docs").select("data").eq("collection","published").eq("data->>store",store);if(error)throw error;
    const ws=addD(today,-today.getDay());const min=+addD(ws,-7);
    weeks=data.map(r=>r.data).filter(w=>w&&w.weekStart&&+pd(w.weekStart)>=min).sort((a,b)=>a.weekStart.localeCompare(b.weekStart));
    loaded=true;if(!cur){const c=weeks.find(w=>+pd(w.weekStart)===+ws)||weeks.find(w=>+pd(w.weekStart)>+ws)||weeks[weeks.length-1];cur=c&&c.weekStart}
    render();
  }catch(e){$("#app").innerHTML=`<div class="empty"><h2>${t("err")}</h2></div>`}
}
render();load();
})();
</script>
</body>
</html>
